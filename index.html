<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3ead9"><meta name="description" content="Jesus Christ — light, hope, and peace.">
<title>Jesus Christ</title>
<style>
:root{color-scheme:light;--ink:#26362d;--paper:#f3ead9;--gold:#bb8c48}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:radial-gradient(ellipse at 50% 44%,#fffaf0 0,#f3ead9 64%,#e8dcc7 100%);font-family:Georgia,'Times New Roman',serif}main{position:relative;isolation:isolate;display:grid;place-items:center;width:min(92vw,900px);min-height:84svh;text-align:center}.halo{position:absolute;z-index:-1;width:min(66vw,590px);aspect-ratio:1;border:1px solid #bb8c4838;border-radius:50%;box-shadow:0 0 0 28px #bb8c4810,0 0 0 78px #bb8c4809}.cross{position:absolute;top:18%;height:58%;width:1px;background:linear-gradient(transparent,#bb8c4890 18%,#bb8c4890 82%,transparent)}.cross:after{content:'';position:absolute;width:68px;height:1px;background:#bb8c4890;top:29%;left:50%;transform:translateX(-50%)}section{padding:2rem}.eyebrow{margin:0 0 1rem;color:#96723f;letter-spacing:.28em;text-transform:uppercase;font:500 .7rem/1.4 system-ui,sans-serif}h1{margin:0;font-size:clamp(3.5rem,11vw,8.5rem);line-height:.95;font-weight:400;letter-spacing:-.055em}.rule{width:42px;height:1px;background:var(--gold);margin:2rem auto 1.4rem}.line{margin:0;font-size:clamp(1rem,2.4vw,1.3rem);font-style:italic;color:#536257}footer{position:absolute;bottom:5%;color:#8b887c;font:.68rem/1.5 system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase}@media(prefers-reduced-motion:no-preference){.halo{animation:breathe 8s ease-in-out infinite alternate}@keyframes breathe{to{transform:scale(1.035);opacity:.72}}}
</style></head><body><main><div class="halo" aria-hidden="true"></div><div class="cross" aria-hidden="true"></div><section><p class="eyebrow">Light · Hope · Peace</p><h1>Jesus<br>Christ</h1><div class="rule" aria-hidden="true"></div><p class="line">“Peace I leave with you; my peace I give you.”</p></section><footer>John 14:27</footer></main></body></html>
